<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>凡人训练传</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1a2e;
  --card:#16213e;
  --card2:#0f3460;
  --gold:#c9a96e;
  --gold2:#e8c170;
  --gold-bright:#ffd700;
  --warm:#f0c060;
  --danger:#8b0000;
  --text:#e0d5c1;
  --text2:#9a8c7a;
  --success:#5cb85c;
  --radius:14px;
  --nav-h:64px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --header-h:72px;
  --shadow:0 4px 20px rgba(0,0,0,.4);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
  background:var(--bg);color:var(--text);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
/* Scrollbar */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}

/* ============ ONBOARDING OVERLAY ============ */
#onboarding-overlay{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#0f0f23 0%,#1a1a2e 50%,#16213e 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;overflow-y:auto;
  animation:fadeIn .6s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 8px rgba(201,169,110,.3)}50%{box-shadow:0 0 20px rgba(201,169,110,.6)}}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes qiRise{from{transform:translateY(0);opacity:1}to{transform:translateY(-40px);opacity:0}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes borderGlow{0%,100%{border-color:rgba(201,169,110,.3)}50%{border-color:rgba(201,169,110,.8)}}
@keyframes breakthrough{0%{transform:scale(.3);opacity:0}50%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}

.onboarding-step{display:none;width:100%;max-width:400px;animation:slideUp .5s ease}
.onboarding-step.active{display:block}
.onboarding-step h1{font-size:28px;font-weight:700;text-align:center;margin-bottom:12px;color:var(--gold2);font-family:"Noto Serif SC","Songti SC",serif;letter-spacing:2px}
.onboarding-step p{text-align:center;color:var(--text2);font-size:15px;line-height:1.6;margin-bottom:24px}
.onboarding-step .subtitle{font-size:14px;color:var(--text2);text-align:center;margin-bottom:20px;line-height:1.5}

.ob-btn{display:block;width:100%;padding:14px;margin-bottom:10px;border:1px solid rgba(201,169,110,.3);border-radius:var(--radius);background:var(--card);color:var(--text);font-size:15px;cursor:pointer;text-align:left;transition:all .2s}
.ob-btn:hover,.ob-btn:active{background:var(--card2);border-color:var(--gold);transform:scale(1.01)}
.ob-btn.selected{background:rgba(201,169,110,.15);border-color:var(--gold);box-shadow:0 0 12px rgba(201,169,110,.2)}
.ob-btn .ob-label{font-weight:600;display:block;margin-bottom:4px}
.ob-btn .ob-desc{font-size:13px;color:var(--text2)}

.ob-input-group{margin-bottom:16px}
.ob-input-group label{display:block;font-size:14px;color:var(--text2);margin-bottom:6px;font-weight:500}
.ob-input-group input{width:100%;padding:12px 14px;border:1px solid rgba(201,169,110,.2);border-radius:10px;background:var(--card);color:var(--text);font-size:16px;outline:none;transition:border-color .2s}
.ob-input-group input:focus{border-color:var(--gold);box-shadow:0 0 8px rgba(201,169,110,.2)}
.ob-input-group .hint{font-size:12px;color:var(--text2);margin-top:4px}

.ob-gender-group{display:flex;gap:10px}
.ob-gender-btn{flex:1;padding:12px;border:1px solid rgba(201,169,110,.2);border-radius:10px;background:var(--card);color:var(--text);font-size:15px;cursor:pointer;text-align:center;transition:all .2s}
.ob-gender-btn.selected{background:rgba(201,169,110,.15);border-color:var(--gold)}

.ob-next-btn{display:block;width:100%;padding:16px;border:none;border-radius:var(--radius);background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a2e;font-size:17px;font-weight:700;cursor:pointer;margin-top:12px;transition:all .2s}
.ob-next-btn:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(201,169,110,.4)}
.ob-next-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.ob-skip{display:block;text-align:center;color:var(--text2);font-size:13px;margin-top:12px;cursor:pointer;background:none;border:none;width:100%}
.ob-skip:hover{color:var(--text)}

#ob-result-card{
  background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);
  padding:24px;margin-bottom:20px;text-align:center;
}
#ob-result-card .talent-name{font-size:36px;font-weight:700;color:var(--gold2);font-family:"Noto Serif SC","Songti SC",serif;margin-bottom:8px}
#ob-result-card .talent-label{font-size:14px;color:var(--text2);margin-bottom:12px}
#ob-result-card .talent-desc{font-size:15px;line-height:1.7;color:var(--text);font-style:italic;padding:12px 0;border-top:1px solid rgba(201,169,110,.15)}
#ob-result-card .realm-result{font-size:18px;color:var(--gold);margin-top:12px}

/* ============ MAIN APP ============ */
#main-app{display:none;min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px)}

/* Header */
#app-header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--bg);padding:12px 16px 8px;max-width:480px;margin:0 auto;
}
#header-realm{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;
}
#header-realm .realm-name{font-size:17px;font-weight:700;color:var(--gold2);font-family:"Noto Serif SC","Songti SC",serif}
#header-realm .realm-stage{font-size:13px;color:var(--text2)}
#realm-progress-wrap{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-bottom:4px}
#realm-progress{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width .5s ease;width:0%}
#realm-progress-text{font-size:11px;color:var(--text2);text-align:right}

/* Warning bar */
.warning-bar{
  padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;
  margin-bottom:10px;animation:slideUp .3s ease;
}
.warning-bar.warm{background:rgba(240,192,96,.12);color:var(--warm);border:1px solid rgba(240,192,96,.25)}
.warning-bar.danger{background:rgba(139,0,0,.15);color:#ff6b6b;border:1px solid rgba(139,0,0,.3)}

/* Pages */
.page{display:none;padding-top:calc(var(--header-h) + 16px);max-width:480px;margin:0 auto;animation:fadeIn .3s ease}
.page.active{display:block}

/* Bottom Nav */
#bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--card);border-top:1px solid rgba(255,255,255,.06);
  padding:6px 0 calc(6px + var(--safe-bottom));
  display:flex;justify-content:space-around;max-width:480px;margin:0 auto;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:none;color:var(--text2);font-size:11px;cursor:pointer;
  padding:4px 12px;transition:color .2s;border-radius:8px;
  min-width:56px;min-height:44px;
}
.nav-btn .nav-icon{font-size:20px;line-height:1}
.nav-btn.active{color:var(--gold2)}
.nav-btn.active .nav-icon{text-shadow:0 0 10px rgba(201,169,110,.4)}

/* ============ PAGE: REALM (洞府) ============ */
.realm-header-card{
  background:linear-gradient(135deg,var(--card),var(--card2));
  border-radius:var(--radius);padding:20px;margin-bottom:12px;
  border:1px solid rgba(201,169,110,.1);
}
.realm-header-card .big-realm{font-size:22px;font-weight:700;color:var(--gold2);font-family:"Noto Serif SC","Songti SC",serif}
.realm-header-card .qi-today{font-size:14px;color:var(--text2);margin-top:4px}
.realm-header-card .qi-today span{color:var(--gold-bright);font-weight:700;font-size:18px}
.realm-header-card .consecutive{font-size:14px;color:var(--text2);margin-top:4px}
.realm-header-card .consecutive span{color:var(--gold);font-weight:600}

.start-training-btn{
  display:block;width:100%;padding:18px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#1a1a2e;font-size:18px;font-weight:700;cursor:pointer;
  margin-bottom:12px;transition:all .2s;letter-spacing:2px;
}
.start-training-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(201,169,110,.35)}
.start-training-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.start-training-btn.rest-suggest{background:linear-gradient(135deg,var(--warm),#d4a040);animation:glowPulse 2s infinite}

/* Rest day */
.rest-card{
  background:linear-gradient(135deg,rgba(240,192,96,.08),rgba(201,169,110,.05));
  border:1px solid rgba(240,192,96,.25);border-radius:var(--radius);padding:16px;margin-bottom:12px;
}
.rest-card .rest-title{font-size:16px;font-weight:600;color:var(--warm);margin-bottom:10px;text-align:center}
.rest-card .rest-title .emoji{font-size:24px}
.rest-options{display:flex;flex-direction:column;gap:8px}
.rest-option{
  padding:12px;border-radius:10px;border:1px solid rgba(240,192,96,.15);
  background:rgba(0,0,0,.2);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:10px;
}
.rest-option:hover,.rest-option:active{border-color:var(--warm);background:rgba(240,192,96,.08)}
.rest-option .ro-icon{font-size:22px}
.rest-option .ro-text{flex:1}
.rest-option .ro-text .ro-name{font-size:14px;font-weight:600;color:var(--text)}
.rest-option .ro-text .ro-desc{font-size:12px;color:var(--text2)}
.rest-option .ro-btn{padding:6px 14px;border:none;border-radius:8px;background:var(--warm);color:#1a1a2e;font-size:13px;font-weight:600;cursor:pointer}

/* Quote */
.quote-card{
  background:var(--card);border-radius:var(--radius);padding:16px;
  border-left:3px solid var(--gold);margin-bottom:12px;
}
.quote-card .quote-text{font-size:14px;line-height:1.6;color:var(--text);font-style:italic}
.quote-card .quote-source{font-size:12px;color:var(--text2);margin-top:6px;text-align:right}

/* ============ PAGE: TRAINING (修炼) ============ */
.train-status-bar{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--card);border-radius:var(--radius);padding:8px 14px;
  margin-bottom:10px;border:1px solid rgba(201,169,110,.1);
  min-height:40px;flex-wrap:wrap;gap:4px;
}
.train-status-bar .tsb-item{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:4px}
.train-status-bar .tsb-item .tsb-val{font-weight:600}
.train-status-bar .tsb-item .tsb-val.qi{color:var(--gold-bright)}
.train-status-bar .tsb-item .tsb-val.time{color:var(--gold)}
.train-status-bar .tsb-item .tsb-val.rest{color:var(--warm)}
.train-status-bar .tsb-item .tsb-val.done{color:var(--success)}

.exercise-list{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.exercise-card{
  background:var(--card);border-radius:var(--radius);padding:14px;
  border:1px solid rgba(201,169,110,.1);transition:all .2s;
}
.exercise-card .ec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.exercise-card .ec-name{font-size:16px;font-weight:600}
.exercise-card .ec-name .emoji{margin-right:6px}
.exercise-card .ec-muscle{font-size:12px;color:var(--text2);background:rgba(201,169,110,.1);padding:2px 8px;border-radius:4px}
.exercise-card .ec-sets{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exercise-card .ec-sets input{
  width:52px;padding:6px 8px;border:1px solid rgba(201,169,110,.15);border-radius:6px;
  background:rgba(0,0,0,.3);color:var(--text);font-size:14px;text-align:center;outline:none;
}
.exercise-card .ec-sets input:focus{border-color:var(--gold)}
.exercise-card .ec-sets label{font-size:12px;color:var(--text2)}
.exercise-card .ec-actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.exercise-card .ec-actions button{
  padding:6px 14px;border:none;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;
  min-height:36px;
}
.btn-add-set{background:rgba(201,169,110,.15);color:var(--gold)}
.btn-add-set:hover{background:rgba(201,169,110,.25)}
.btn-remove{background:rgba(139,0,0,.2);color:#ff6b6b}
.btn-remove:hover{background:rgba(139,0,0,.35)}
.btn-complete-set{background:rgba(92,184,92,.15);color:var(--success)}
.btn-remove-exercise{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:4px}

.add-exercise-bar{
  display:flex;gap:8px;margin-bottom:16px;
}
.add-exercise-bar select{
  flex:1;padding:12px;border:1px solid rgba(201,169,110,.2);border-radius:10px;
  background:var(--card);color:var(--text);font-size:14px;outline:none;
}
.add-exercise-bar button{
  padding:12px 18px;border:none;border-radius:10px;background:var(--gold);color:#1a1a2e;
  font-weight:600;cursor:pointer;white-space:nowrap;min-height:44px;
}



/* Qi float animation */
.qi-float{
  position:fixed;pointer-events:none;z-index:999;
  font-size:22px;font-weight:700;color:var(--gold-bright);
  text-shadow:0 0 8px rgba(255,215,0,.5);
  animation:qiRise 1s ease-out forwards;
}

/* ============ PAGE: SKILLS (功法) ============ */
.skills-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.skills-header h2{font-size:18px;color:var(--gold2)}
.skills-header button{background:rgba(201,169,110,.15);border:1px solid rgba(201,169,110,.3);color:var(--gold);padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;min-height:40px}
.skill-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid rgba(201,169,110,.1);transition:all .2s}
.skill-card .sc-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.skill-card .sc-name{font-size:16px;font-weight:600}
.skill-card .sc-name .alias{font-size:12px;color:var(--text2);font-weight:400}
.skill-card .sc-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.skill-tag{padding:2px 8px;border-radius:4px;font-size:11px}
.skill-tag.muscle{background:rgba(201,169,110,.1);color:var(--gold)}
.skill-tag.grade{background:rgba(92,184,92,.1);color:var(--success)}
.skill-tag.prof{background:rgba(240,192,96,.1);color:var(--warm)}
.skill-card .sc-stats{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text2)}
.skill-card .sc-stats span{white-space:nowrap}

/* Route selection */
.route-card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid rgba(201,169,110,.1);cursor:pointer;transition:all .2s}
.route-card:hover,.route-card:active{border-color:var(--gold)}
.route-card.selected{background:rgba(201,169,110,.08);border-color:var(--gold)}
.route-card .rc-name{font-size:16px;font-weight:600;color:var(--gold2)}
.route-card .rc-desc{font-size:13px;color:var(--text2);margin-top:4px}
.route-card .rc-info{font-size:12px;color:var(--text2);margin-top:4px}

/* Custom exercise form */
.custom-ex-form{padding:16px;background:var(--card);border-radius:var(--radius);margin-bottom:12px;border:1px solid rgba(201,169,110,.15)}
.custom-ex-form h3{font-size:15px;color:var(--gold2);margin-bottom:10px}
.custom-ex-form .cef-row{display:flex;gap:8px;margin-bottom:8px}
.custom-ex-form input,.custom-ex-form select{flex:1;padding:10px;border:1px solid rgba(201,169,110,.15);border-radius:8px;background:rgba(0,0,0,.3);color:var(--text);font-size:14px;outline:none}
.custom-ex-form input:focus,.custom-ex-form select:focus{border-color:var(--gold)}
.custom-ex-form button{padding:10px 18px;border:none;border-radius:8px;background:var(--gold);color:#1a1a2e;font-weight:600;cursor:pointer;min-height:40px}

/* ============ PAGE: SECRET REALM (秘境) ============ */

.trib-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(201,169,110,.15);transition:all .2s}
.trib-card .tc-type{font-size:12px;color:var(--text2);margin-bottom:4px}
.trib-card .tc-title{font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px}
.trib-card .tc-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.trib-card .tc-reward{font-size:13px;color:var(--gold-bright);margin-bottom:10px}
.trib-card .tc-btn{padding:10px 20px;border:none;border-radius:8px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a2e;font-size:14px;font-weight:600;cursor:pointer;width:100%;min-height:44px;transition:all .2s}
.trib-card .tc-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(201,169,110,.3)}
.trib-card .tc-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.trib-card .tc-btn.done{background:rgba(92,184,92,.2);color:var(--success);cursor:default}
.trib-card .tc-btn.recovery{background:rgba(240,192,96,.15);color:var(--warm)}
.trib-completed{text-align:center;padding:24px;color:var(--success)}
.trib-completed .tc-icon{font-size:36px;margin-bottom:8px}

/* ============ PAGE: ATLAS (图谱) ============ */
.atlas-section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(201,169,110,.1)}
.atlas-section h3{font-size:16px;color:var(--gold2);margin-bottom:10px;font-family:"Noto Serif SC","Songti SC",serif}
.atlas-stat-row{display:flex;justify-content:space-around;margin:12px 0;flex-wrap:wrap;gap:8px}
.atlas-stat{text-align:center;flex:1;min-width:80px}
.atlas-stat .as-value{font-size:24px;font-weight:700;color:var(--gold-bright)}
.atlas-stat .as-label{font-size:12px;color:var(--text2);margin-top:2px}

/* Timeline */
.timeline{position:relative;padding-left:24px;margin:12px 0}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:rgba(201,169,110,.2)}
.timeline-item{position:relative;padding:8px 0 8px 16px;border-left:2px solid var(--gold);margin-bottom:8px}
.timeline-item::before{content:'●';position:absolute;left:-9px;top:8px;color:var(--gold);font-size:14px}
.timeline-item .ti-date{font-size:11px;color:var(--text2)}
.timeline-item .ti-text{font-size:13px;color:var(--text);margin-top:2px}

/* Chart bar */
.chart-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.chart-bar-wrap .chart-label{font-size:12px;color:var(--text2);width:60px;text-align:right;flex-shrink:0}
.chart-bar-track{flex:1;height:20px;background:rgba(255,255,255,.05);border-radius:10px;overflow:hidden;position:relative}
.chart-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:10px;transition:width .5s ease;min-width:4px}
.chart-bar-value{font-size:11px;color:var(--text2);width:40px;text-align:left}

/* Muscle distribution */
.muscle-bar{margin-bottom:8px}
.muscle-bar .mb-label{font-size:12px;color:var(--text2);margin-bottom:2px;display:flex;justify-content:space-between}
.muscle-bar .mb-track{height:12px;background:rgba(255,255,255,.05);border-radius:6px;overflow:hidden}
.muscle-bar .mb-fill{height:100%;border-radius:6px;transition:width .5s ease}

/* Leaderboard */
.lb-card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:12px;border:1px solid rgba(201,169,110,.15)}
.lb-card h3{font-size:16px;color:var(--gold2);margin-bottom:10px;text-align:center}
.lb-entry{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.lb-entry:last-child{border-bottom:none}
.lb-entry .lb-rank{width:24px;text-align:center;font-size:13px;font-weight:700;color:var(--text2)}
.lb-entry .lb-rank.gold{color:var(--gold)}
.lb-entry .lb-rank.silver{color:#c0c0c0}
.lb-entry .lb-rank.bronze{color:#cd7f32}
.lb-entry .lb-rank.self{color:var(--gold-bright)}
.lb-entry .lb-name{flex:1;font-size:14px}
.lb-entry .lb-name.self{color:var(--gold-bright);font-weight:600}
.lb-entry .lb-qi{font-size:13px;color:var(--gold-bright)}
.lb-entry .lb-realm{font-size:11px;color:var(--text2)}

/* Achievements */
.achievement-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.achievement-item{background:rgba(201,169,110,.05);border:1px solid rgba(201,169,110,.1);border-radius:10px;padding:10px;text-align:center;transition:all .2s}
.achievement-item.unlocked{border-color:var(--gold);background:rgba(201,169,110,.1)}
.achievement-item.locked{opacity:.4}
.achievement-item .ai-icon{font-size:24px;margin-bottom:4px}
.achievement-item .ai-name{font-size:11px;color:var(--text);line-height:1.3}
.achievement-item.locked .ai-icon{filter:grayscale(1)}

/* Weight editor */
.weight-edit{display:flex;gap:8px;align-items:center;margin-top:8px}
.weight-edit input{width:80px;padding:8px;border:1px solid rgba(201,169,110,.2);border-radius:8px;background:rgba(0,0,0,.3);color:var(--text);font-size:14px;text-align:center;outline:none}
.weight-edit input:focus{border-color:var(--gold)}
.weight-edit button{padding:8px 16px;border:none;border-radius:8px;background:var(--gold);color:#1a1a2e;font-weight:600;cursor:pointer;min-height:40px}

/* ============ PLACEHOLDER (图谱) ============ */
.placeholder-page{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:60px 24px;text-align:center;min-height:50vh;
}
.placeholder-page .placeholder-icon{font-size:48px;margin-bottom:16px;opacity:.5}
.placeholder-page h3{font-size:18px;color:var(--gold2);margin-bottom:8px}
.placeholder-page p{font-size:14px;color:var(--text2);line-height:1.6}

/* ============ MODALS ============ */
.modal-overlay{
  position:fixed;inset:0;z-index:5000;
  background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;
  padding:24px;backdrop-filter:blur(4px);
}
.modal-overlay.active{display:flex}
.modal-card{
  background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);
  padding:24px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto;
  animation:breakthrough .5s ease;
}
.modal-card h2{font-size:20px;color:var(--gold2);text-align:center;margin-bottom:12px;font-family:"Noto Serif SC","Songti SC",serif}
.modal-card .modal-body{font-size:14px;line-height:1.7;color:var(--text);margin-bottom:16px}
.modal-card .modal-body .big-num{font-size:28px;font-weight:700;color:var(--gold-bright);text-align:center;margin:12px 0}
.modal-card .modal-btn{
  display:block;width:100%;padding:14px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1a2e;
  font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;
}

/* Breakthrough special */
.bt-overlay{background:rgba(26,26,46,.85)}
.bt-card{border-color:var(--gold2);text-align:center}
.bt-card .bt-narrative{font-size:15px;line-height:1.8;color:var(--text);margin-bottom:16px;font-style:italic}
.bt-card .bt-narrative p{margin-bottom:8px}
.bt-card .bt-narrative .boom{font-size:20px;font-weight:700;color:var(--gold-bright)}

/* Summary */
.summary-stats{display:flex;justify-content:space-around;margin:16px 0}
.summary-stat{text-align:center}
.summary-stat .ss-value{font-size:28px;font-weight:700;color:var(--gold-bright)}
.summary-stat .ss-label{font-size:12px;color:var(--text2);margin-top:4px}
.summary-pr{background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);border-radius:10px;padding:12px;text-align:center;margin-bottom:12px}
.summary-pr .pr-text{font-size:16px;color:var(--gold-bright);font-weight:700}
.summary-pr .pr-bonus{font-size:13px;color:var(--text2);margin-top:4px}
.summary-warning{background:rgba(240,192,96,.1);border:1px solid rgba(240,192,96,.2);border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;color:var(--warm);text-align:center}

/* ============ RESPONSIVE ============ */
@media(max-width:360px){
  .onboarding-step h1{font-size:24px}
  .realm-header-card .big-realm{font-size:19px}
  .exercise-card .ec-sets input{width:44px;font-size:13px}
}
@media(min-width:480px){
  body{background:#0f0f23}
  #main-app,#onboarding-overlay{max-width:480px;margin:0 auto}
}

/* Muscle group warning flashing */
@keyframes warnPulse{0%,100%{border-color:rgba(240,192,96,.2)}50%{border-color:rgba(240,192,96,.6)}}
.muscle-warn{border-color:var(--warm)!important;animation:warnPulse 1.5s infinite}

/* Hidden utility */
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ==================== ONBOARDING ==================== -->
<div id="onboarding-overlay">
  <!-- Step 1: Welcome -->
  <div class="onboarding-step active" data-step="1">
    <div style="text-align:center;font-size:64px;margin-bottom:16px;animation:float 3s ease-in-out infinite">🏔️</div>
    <h1>天地初开，灵力涌动</h1>
    <p style="font-size:16px">凡人，请上前测试根骨——<br>你的修行之路，始于今日。</p>
    <button class="ob-next-btn" onclick="goObStep(2)">开始根骨测试</button>
  </div>

  <!-- Step 2: Experience -->
  <div class="onboarding-step" data-step="2">
    <h1>修炼年限</h1>
    <p>你在修行之道上走了多远？</p>
    <button class="ob-btn" data-val="beginner" onclick="selectOb(this,'experience')">
      <span class="ob-label">🌱 初涉修行</span>
      <span class="ob-desc">刚开始健身，不足 3 月</span>
    </button>
    <button class="ob-btn" data-val="3-12months" onclick="selectOb(this,'experience')">
      <span class="ob-label">🌿 略有小成</span>
      <span class="ob-desc">3 月 ~ 1 年</span>
    </button>
    <button class="ob-btn" data-val="1-3years" onclick="selectOb(this,'experience')">
      <span class="ob-label">🌳 根基稳固</span>
      <span class="ob-desc">1 ~ 3 年</span>
    </button>
    <button class="ob-btn" data-val="3+years" onclick="selectOb(this,'experience')">
      <span class="ob-label">🌲 修道老手</span>
      <span class="ob-desc">3 年以上</span>
    </button>
  </div>

  <!-- Step 3: PR data (optional) -->
  <div class="onboarding-step" data-step="3">
    <h1>当前战力</h1>
    <p>诚实为上，虚报战力只会误己修行。<br>不知者留空即可。</p>
    <div class="ob-input-group">
      <label>🦵 深蹲 ___ kg</label>
      <input type="number" id="ob-squat" placeholder="留空跳过" min="0">
    </div>
    <div class="ob-input-group">
      <label>🏋️ 卧推 ___ kg</label>
      <input type="number" id="ob-bench" placeholder="留空跳过" min="0">
    </div>
    <div class="ob-input-group">
      <label>🔗 硬拉 ___ kg</label>
      <input type="number" id="ob-deadlift" placeholder="留空跳过" min="0">
    </div>
    <div class="ob-input-group">
      <label>💪 引体向上 ___ 次</label>
      <input type="number" id="ob-pullup" placeholder="留空跳过" min="0">
    </div>
    <button class="ob-next-btn" onclick="goObStep(4)" style="margin-top:8px">确认，下一步 →</button>
    <button class="ob-skip" onclick="goObStep(4)">跳过 →</button>
  </div>

  <!-- Step 4: Body stats -->
  <div class="onboarding-step" data-step="4">
    <h1>肉身根基</h1>
    <p>基本体魄数据，缺一不可。</p>
    <div class="ob-input-group">
      <label>⚖️ 体重 (kg) <span style="color:var(--gold)">*必填</span></label>
      <input type="number" id="ob-weight" placeholder="如 70" min="20" max="400">
    </div>
    <div class="ob-input-group">
      <label>性别</label>
      <div class="ob-gender-group">
        <button class="ob-gender-btn" data-val="male" onclick="selectGender(this)">♂ 男</button>
        <button class="ob-gender-btn" data-val="female" onclick="selectGender(this)">♀ 女</button>
        <button class="ob-gender-btn" data-val="undisclosed" onclick="selectGender(this)">不便透露</button>
      </div>
    </div>
    <button class="ob-next-btn" id="ob-body-next" disabled onclick="calculateTalent()">鉴定根骨</button>
  </div>

  <!-- Step 5: Result -->
  <div class="onboarding-step" data-step="5">
    <h1>鉴定结果</h1>
    <div id="ob-result-card">
      <div class="talent-name" id="ob-talent-name">—</div>
      <div class="talent-label">修仙天赋</div>
      <div class="realm-result" id="ob-initial-realm">—</div>
      <div class="talent-desc" id="ob-talent-desc">—</div>
    </div>
    <button class="ob-next-btn" onclick="completeOnboarding()">踏入修行之路</button>
  </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="main-app">

  <!-- Header -->
  <header id="app-header">
    <div id="header-realm">
      <span class="realm-name" id="h-realm-name">凡人之躯·初期</span>
      <span class="realm-stage" id="h-qi-total">0 灵力</span>
    </div>
    <div id="realm-progress-wrap">
      <div id="realm-progress" style="width:0%"></div>
    </div>
    <div id="realm-progress-text" style="display:flex;justify-content:space-between">
      <span id="h-stage-label">初期</span>
      <span id="h-qi-next">下一境: 100 灵力</span>
    </div>
  </header>

  <!-- Warning area -->
  <div id="warning-area" style="padding-top:calc(var(--header-h) + 8px);max-width:480px;margin:0 auto"></div>

  <!-- ======== PAGE: 洞府 (Realm) ======== -->
  <section id="page-realm" class="page active">
    <div class="realm-header-card">
      <div class="big-realm" id="realm-title" onclick="showRealmTable()" style="cursor:pointer" title="点击查看完整境界表">凡人之躯·初期 <span style="font-size:14px;color:var(--text2)">📖</span></div>
      <div class="qi-today">今日获取灵力：<span id="today-qi-display">0</span></div>
      <div class="consecutive">闭关第 <span id="consecutive-display">0</span> 天</div>
    </div>
    <div id="rest-suggestion-area"></div>
    <div id="route-recommendation"></div>
    <button class="start-training-btn" id="start-training-btn" onclick="goToTraining()">开始修炼</button>
    <div id="rest-card-container"></div>
    <div id="quote-container"></div>
  </section>

  <!-- ======== PAGE: 修炼 (Training) ======== -->
  <section id="page-training" class="page">
    <!-- Compact status bar -->
    <div id="train-status-bar" class="train-status-bar"></div>
    <!-- Route hint (compact) -->
    <div id="training-route-plan"></div>
    <!-- Muscle warning -->
    <div id="muscle-warning-area"></div>
    <!-- Add exercise -->
    <div class="add-exercise-bar">
      <select id="exercise-select">
        <option value="">选择功法…</option>
      </select>
      <button onclick="addExerciseToTraining()">＋ 添加</button>
    </div>
    <!-- Exercise list -->
    <div id="training-exercise-list" class="exercise-list"></div>
    <!-- Action buttons (start + end) -->
    <div id="train-actions"></div>
  </section>

  <!-- ======== PAGE: 功法 (Skills) ======== -->
  <section id="page-skills" class="page">
    <div class="skills-header">
      <h2>📜 功法阁</h2>
      <button onclick="toggleRouteSelect()">🗺️ 功法路线</button>
    </div>
    <div id="route-selection-area" style="display:none"></div>
    <div id="custom-exercise-area" style="display:none"></div>
    <div id="skills-exercise-list"></div>
  </section>

  <!-- ======== PAGE: 秘境 (Secret Realm) ======== -->
  <section id="page-tribulation" class="page">
    <div id="secret-realm-content"></div>
  </section>

  <!-- ======== PAGE: 图谱 (Atlas) ======== -->
  <section id="page-atlas" class="page">
    <div id="atlas-content"></div>
  </section>

  <!-- Bottom Nav -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-page="realm" onclick="switchPage('realm')">
      <span class="nav-icon">🏠</span>洞府
    </button>
    <button class="nav-btn" data-page="training" onclick="switchPage('training')">
      <span class="nav-icon">⚔️</span>修炼
    </button>
    <button class="nav-btn" data-page="skills" onclick="switchPage('skills')">
      <span class="nav-icon">📜</span>功法
    </button>
    <button class="nav-btn" data-page="tribulation" onclick="switchPage('tribulation')">
      <span class="nav-icon">🏛️</span>秘境
      <span id="realm-badge" style="display:none;position:absolute;top:2px;right:4px;width:8px;height:8px;background:#ff4444;border-radius:50%;box-shadow:0 0 4px rgba(255,68,68,.6)"></span>
    </button>
    <button class="nav-btn" data-page="atlas" onclick="switchPage('atlas')">
      <span class="nav-icon">🗺️</span>图谱
    </button>
  </nav>
</div>

<!-- ==================== BREAKTHROUGH MODAL ==================== -->
<div class="modal-overlay bt-overlay" id="breakthrough-modal">
  <div class="modal-card bt-card">
    <div style="font-size:48px;margin-bottom:12px">✨</div>

    <div class="bt-narrative" id="bt-narrative"></div>

<div class="modal-overlay" id="pr-modal">

    <div style="font-size:16px;color:var(--text);line-height:1.6;margin-bottom:16px" id="pr-text">战力新高！</div>

</div>

<div class="modal-overlay" id="summary-modal">
  <div class="modal-card">
    <h2>修炼结算</h2>
    <div id="summary-content"></div>
    <button class="modal-btn" onclick="closeSummary()">巩固修为</button>
  </div>
</div>

function initOnboarding(){
  // reset
  obState = { experience:null, gender:null };
  showObStep(1);
}

function showObStep(n){
  document.querySelectorAll('.onboarding-step').forEach(s=>s.classList.remove('active'));
  const el = document.querySelector(`.onboarding-step[data-step="${n}"]`);
  if(el) el.classList.add('active');
  // Scroll to top
  document.getElementById('onboarding-overlay').scrollTop = 0;
}

function goObStep(n){
  // Validate current step before proceeding
  if(n === 3){
    // Leaving step 2 (experience) — must have selection
    if(!obState.experience){
      const sel = document.querySelector('.ob-btn.selected');
      if(sel) obState.experience = sel.dataset.val;
      else return;
    }
  }
  showObStep(n);
  // If step 4, check body data
  if(n === 4) checkObBody();
}

function selectOb(el, field){
  document.querySelectorAll(`.ob-btn[data-val]`).forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  obState[field] = el.dataset.val;
  // Auto-advance: experience selected → go to step 3 (PR data)
  if(field === 'experience') goObStep(3);
}

function selectGender(el){
  document.querySelectorAll('.ob-gender-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  obState.gender = el.dataset.val;
  checkObBody();
}

function checkObBody(){
  const weight = document.getElementById('ob-weight').value;
  const btn = document.getElementById('ob-body-next');
  if(weight && weight > 0 && obState.gender){
    btn.disabled = false;
  } else {
    btn.disabled = true;
  }
}

function calculateTalent(){
  const weight = parseFloat(document.getElementById('ob-weight').value) || 70;
  const squat = parseFloat(document.getElementById('ob-squat').value) || null;
  const bench = parseFloat(document.getElementById('ob-bench').value) || null;
  const deadlift = parseFloat(document.getElementById('ob-deadlift').value) || null;
  const pullup = parseFloat(document.getElementById('ob-pullup').value) || null;
  const exp = obState.experience;
  const gender = obState.gender;

  const hasPR = squat || bench || deadlift || pullup;
  let talent = '凡骨';
  let realmIdx = 0;
  let stage = 0;

  // Determine max PR / weight ratio
  const maxPR = Math.max(squat||0, bench||0, deadlift||0);
  const ratio = weight > 0 ? maxPR / weight : 0;

  if(exp === '3+years' && ratio >= 1.5){
    talent = '异灵根';
    realmIdx = 3; // 筑基境
    stage = 0;
  } else if(exp === '3+years' || ratio >= 1.5){
    talent = '天灵根';
    realmIdx = 2; // 开元境
    stage = 0;
  } else if(exp === '1-3years'){
    talent = '双灵根';
    realmIdx = 1; // 淬体境
    stage = 3; // 圆满
  } else if(exp === '3-12months'){
    talent = '三灵根';
    realmIdx = 1; // 淬体境
    stage = 0;
  } else if(hasPR){
    talent = '劣灵根';
    realmIdx = 0; // 凡人之躯
    stage = 2; // 后期
  } else {
    talent = '凡骨';
    realmIdx = 0;
    stage = 0;
  }

  // Store
  appData = getDefaultData();
  appData.user.onboardingComplete = false;
  appData.user.talent = talent;
  appData.user.talentComment = TALENT_COMMENTS[talent]?.desc || '';
  appData.user.experience = exp;
  appData.user.weight = weight;
  appData.user.gender = gender;
  appData.user.squat = squat;
  appData.user.bench = bench;
  appData.user.deadlift = deadlift;
  appData.user.pullup = pullup;
  // Set initial realm
  appData.realmIdx = realmIdx;
  appData.realmStage = stage;

  // Set NPC qi
  const totalQi = getRealmQi(realmIdx, stage);
  appData.totalQi = totalQi;
  appData.npcLeaderboard.forEach((npc,i)=>{
    const mult = NPC_QI_MULTIPLIERS[i % NPC_QI_MULTIPLIERS.length];
    npc.qi = Math.round(totalQi * mult);
    const r = getRealmFromQi(npc.qi);
    npc.title = REALMS[r.idx].name + '·' + STAGES[r.stage];
  });

  saveData();

  // Show result
  document.getElementById('ob-talent-name').textContent = talent;
  document.getElementById('ob-initial-realm').textContent = REALMS[realmIdx].name + '·' + STAGES[stage];
  document.getElementById('ob-talent-desc').textContent = TALENT_COMMENTS[talent]?.desc || '';
  showObStep(5);
}

// ===================================================================
// REALM CALCULATIONS
// ===================================================================
function getRealmQi(realmIdx, stage){
  let qi = 0;
  for(let i=0;i<REALMS.length;i++){
    const next = i+1 < REALMS.length ? REALMS[i+1].threshold : REALMS[i].threshold + 100000;
    const range = next - REALMS[i].threshold;
    const stageQi = range / 4;
    if(i < realmIdx){
      qi += range;
    } else if(i === realmIdx){
      qi += stageQi * stage;
      break;
    } else break;
  }
  return qi;
}

function getRealmFromQi(qi){
  for(let i=REALMS.length-1;i>=0;i--){
    if(qi >= REALMS[i].threshold){
      const next = i+1 < REALMS.length ? REALMS[i+1].threshold : REALMS[i].threshold + 100000;
      const range = next - REALMS[i].threshold;
      const stageQi = range / 4;
      const stage = i+1 < REALMS.length
        ? Math.min(3, Math.floor((qi - REALMS[i].threshold) / stageQi))
        : 3;
      return { idx:i, stage:Math.max(0,stage) };
    }
  }
  return { idx:0, stage:0 };
}

function getRealmProgress(qi, realmIdx){
  const threshold = REALMS[realmIdx].threshold;
  const next = realmIdx+1 < REALMS.length
    ? REALMS[realmIdx+1].threshold
    : threshold + 100000;
  const total = next - threshold;
  const current = qi - threshold;
  return Math.min(100, Math.max(0, (current / total) * 100));
}

function getCurrentRealmInfo(){
  const r = getRealmFromQi(appData.totalQi);
  return {
    name: REALMS[r.idx].name + '·' + STAGES[r.stage],
    realmIdx: r.idx,
    stage: r.stage,
    progress: getRealmProgress(appData.totalQi, r.idx),
    qi: appData.totalQi,
    nextQi: r.idx+1 < REALMS.length ? REALMS[r.idx+1].threshold : '∞',
  };
}

// ===================================================================
// DATE HELPERS
// ===================================================================
function getTodayStr(){ return new Date().toISOString().slice(0,10); }
function getDateStr(d){ return d.toISOString().slice(0,10); }

function isToday(dateStr){ return dateStr === getTodayStr(); }

function daysBetween(d1, d2){
  const a = new Date(d1), b = new Date(d2);
  return Math.floor((b.getTime() - a.getTime()) / 86400000);
}

function getWeekStart(dateStr, weekOffset){
  const d = new Date(dateStr);
  if(weekOffset) d.setDate(d.getDate() - weekOffset * 7);
  const day = d.getDay();
  d.setDate(d.getDate() - (day === 0 ? 6 : day-1));
  return getDateStr(d);
}

    return;
  }

  if(appData.lastActiveDate === today) return;

  const diff = daysBetween(appData.lastActiveDate, today);

  if(diff === 1){
    // Was yesterday - check if they trained yesterday
    const yesterday = appData.lastActiveDate;
    const hadSession = appData.sessions.some(s => s.date === yesterday);
    if(!hadSession){
      // Rest day detected
      // consecutive days reset only if not training for 2+ days
    }
  }

  if(diff >= 2){
    // Missed days - reset consecutive, gentle message
    appData.consecutiveDays = 0;
  }

  // Reset todayQi
  appData.todayQi = 0;
  appData.lastActiveDate = today;
  saveData();
}

function checkWeeklyVolume(){
  // Calculate current week volume vs last week
  const today = new Date();
  const thisWeekStart = getWeekStart(getTodayStr());
  const lastWeekDate = new Date(today);
  lastWeekDate.setDate(lastWeekDate.getDate()-7);
  const lastWeekStart = getWeekStart(getDateStr(lastWeekDate));

  let thisWeekQi = 0;
  let lastWeekQi = 0;

  appData.sessions.forEach(s=>{
    const week = getWeekStart(s.date);
    if(week === thisWeekStart) thisWeekQi += s.totalQi || 0;
    else if(week === lastWeekStart) lastWeekQi += s.totalQi || 0;
  });

  if(lastWeekQi > 0 && thisWeekQi > lastWeekQi * 1.15){
    return `本周修炼总量较上周增长超过 15%（${Math.round((thisWeekQi/lastWeekQi-1)*100)}%），修行当循序渐进，不宜冒进。`;
  }
  return null;
}

function addExerciseToTraining(){
  const sel = document.getElementById('exercise-select');
  const val = parseInt(sel.value);
  if(isNaN(val)) return;

  // Check if already added
  if(currentTraining.some(t=>t.exerciseIdx === val)){
    alert('此功法已在今日修炼列表中');
    return;
  }

  // Muscle group check for consecutive days
  const ex = appData.exercises[val];
  if(ex){
    const yesterday = new Date();
    yesterday.setDate(yesterday.getDate()-1);
    const yStr = getDateStr(yesterday);
    const yesterdayMuscles = appData.muscleHistory?.[yStr] || [];
    if(yesterdayMuscles.includes(ex.muscle)){
      const warnArea = document.getElementById('muscle-warning-area');
      warnArea.innerHTML = `
        <div class="warning-bar warm muscle-warn">
          🫠 此功法昨日已修习，「${ex.muscle}」肌群经脉尚需温养，建议今日改修其他功法。
        </div>
      `;
    }
  }

  var eq = DEFAULT_EQUIPMENT[appData.exercises[val].name] || 'barbell';
  currentTraining.push({ exerciseIdx:val, sets:[{reps:10, weight:20, completed:false}], equipment:eq });
  renderTraining();
  updateTrainingQiDisplay();
}

function removeExerciseFromTraining(idx){
  currentTraining.splice(idx, 1);
  renderTraining();
  updateTrainingQiDisplay();
}

function addSet(exIdx){
  currentTraining[exIdx].sets.push({reps:10, weight:20, completed:false});
  renderTraining();
}

function removeSet(exIdx, setIdx){
  currentTraining[exIdx].sets.splice(setIdx, 1);
  if(currentTraining[exIdx].sets.length === 0){
    currentTraining.splice(exIdx, 1);
  }
  renderTraining();
  updateTrainingQiDisplay();
}

function updateSet(el){
  const eIdx = parseInt(el.dataset.e);
  const sIdx = parseInt(el.dataset.s);
  const field = el.dataset.f;
  const val = parseFloat(el.value) || 0;
  if(currentTraining[eIdx] && currentTraining[eIdx].sets[sIdx]){
    currentTraining[eIdx].sets[sIdx][field] = val;
    // Update qi display for this exercise
    const qiEl = document.getElementById('set-qi-' + eIdx);
    if(qiEl) qiEl.textContent = calcSetQi(currentTraining[eIdx]);
    updateTrainingQiDisplay();
  }
}

function calcSetQi(exItem){
  const ex = appData.exercises[exItem.exerciseIdx];
  if(!ex) return 0;
  // Get equipment coefficient (supports custom equipment)
  var eqId = exItem.equipment || DEFAULT_EQUIPMENT[ex.name] || 'barbell';
  var eqInfo = getEquipmentInfo(eqId);
  var eqCoef = eqInfo.coeff;
  let total = 0;
  exItem.sets.forEach(function(set){
    const setQi = (set.weight || 0) * (set.reps || 0) * ex.coeff * 0.05 * eqCoef;
    total += setQi;
  });
  return Math.round(total);
}

// Update the equipment lookup to include custom equipment
function getEquipmentInfo(eqId){
  if(!eqId) return { icon:'🏋️', name:'杠铃', coeff:1.0 };
  // Check standard types first
  for(var i=0;i<EQUIPMENT_TYPES.length;i++){
    if(EQUIPMENT_TYPES[i].id === eqId) return EQUIPMENT_TYPES[i];
  }
  // Check custom equipment
  if(window._customEquipment && window._customEquipment[eqId]){
    return window._customEquipment[eqId];
  }
  return { icon:'🔧', name:eqId.replace('custom_',''), coeff:1.0 };
}

function deleteSession(sessionIdx){
  if(!confirm('确认删除此训练记录？灵力将回退 '+appData.sessions[sessionIdx].totalQi+'。')) return;
  const s = appData.sessions[sessionIdx];
  if(!s) return;
  // Roll back Qi
  appData.totalQi = Math.max(0, appData.totalQi - (s.totalQi || 0));
  appData.todayQi = Math.max(0, (appData.todayQi || 0) - (s.totalQi || 0));
  // Remove session
  appData.sessions.splice(sessionIdx, 1);
  appData.totalTrainingDays = Math.max(0, appData.totalTrainingDays - 1);
  saveData();
  // Refresh
  renderTodaySessions();
  renderRealm();
  updateHeader();
  renderQuotes();
  renderWarnings();
  showToast('🗑️ 已删除记录，灵力已回退');
}

function startWorkout(){

  workoutState.isResting = false;

  if(workoutState.timerInterval) clearInterval(workoutState.timerInterval);
  workoutState.timerInterval = setInterval(function(){
    if(workoutState.active && workoutState.startTime){
      workoutState.elapsedWorkout = Math.floor((Date.now() - workoutState.startTime) / 1000);
    }
    if(workoutState.isResting && workoutState.restStartTime){

function completeSet(exIdx, setIdx){
  var item = currentTraining[exIdx];
  if(!item || !item.sets[setIdx]) return;
  // Mark set as completed
  item.sets[setIdx].completed = true;
  // Start rest timer
  workoutState.isResting = true;
  workoutState.restStartTime = Date.now();
  workoutState.elapsedRest = 0;
  workoutState.currentSet = { exIdx: exIdx, setIdx: setIdx };
  renderTrainingList();
  renderTimerBar();
  // Check if all sets are completed
  var allDone = true;
  currentTraining.forEach(function(item2){
    item2.sets.forEach(function(set){
      if(!set.completed) allDone = false;
    });
  });
  if(allDone && currentTraining.length > 0){
    showToast('🎯 所有组已完成！点击「结束修炼」结算灵力');

function formatTime(seconds){

  var s = seconds % 60;
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

// ===================================================================
// END TRAINING
// ===================================================================
function endTraining(){
  if(currentTraining.length === 0) return;

  // Stop workout timer
  if(workoutState.timerInterval){
    clearInterval(workoutState.timerInterval);
    workoutState.timerInterval = null;
  }
  workoutState.active = false;
  workoutState.isResting = false;
  workoutState.elapsedWorkout = 0;
  workoutState.elapsedRest = 0;

  const today = getTodayStr();
  let totalQi = 0;
  let hasPR = false;
  let prText = '';
  let newMuscles = [];

  // Calculate total Qi
  currentTraining.forEach(item=>{
    const ex = appData.exercises[item.exerciseIdx];
    if(!ex) return;
    var eqId = item.equipment || DEFAULT_EQUIPMENT[ex.name] || 'barbell';
    var eqInfo = getEquipmentInfo(eqId);
    var eqCoef = eqInfo.coeff;
    // Ensure prByEquipment exists
    if(!ex.prByEquipment) ex.prByEquipment = {};
    if(!ex.prByEquipment[eqId]) ex.prByEquipment[eqId] = { maxWeight:0, maxReps:0, maxVolume:0 };
    var eqPR = ex.prByEquipment[eqId];

    item.sets.forEach(function(set){
      const setQi = (set.weight || 0) * (set.reps || 0) * ex.coeff * 0.05 * eqCoef;
      totalQi += setQi;

      // Check PR per equipment
      if(set.weight > eqPR.maxWeight){
        eqPR.maxWeight = set.weight;
        if(set.weight > ex.maxWeight) ex.maxWeight = set.weight;
        hasPR = true;
        prText += ex.alias + ' [' + eqId + '] 重量突破 ' + set.weight + 'kg！';
      }
      if(set.reps > eqPR.maxReps){
        eqPR.maxReps = set.reps;
        if(set.reps > ex.maxReps) ex.maxReps = set.reps;
        if(!hasPR) prText = '';
        prText += ex.alias + ' 次数突破 ' + set.reps + ' 次！';
        hasPR = true;
      }
      ex.totalSets++;
      ex.totalVolume += set.weight * set.reps;
    });
    if(!newMuscles.includes(ex.muscle)) newMuscles.push(ex.muscle);
  });

  totalQi = Math.round(totalQi);

  // Consecutive bonus
  const conBonus = appData.consecutiveDays >= 5 ? 1.2 : appData.consecutiveDays >= 3 ? 1.1 : 1.0;
  let rawQi = totalQi;
  totalQi = Math.round(totalQi * conBonus);

  // Penalty for 7+ consecutive days
  const hasPenalty = appData.consecutiveDays >= 7;
  if(hasPenalty){
    totalQi = Math.round(totalQi * 0.5);
  }

  // PR bonus
  if(hasPR){
    totalQi += 100;
  }

  // Qi generation
  const todayQi = appData.todayQi || 0;
  appData.todayQi = todayQi + totalQi;
  appData.totalQi += totalQi;
  appData.consecutiveDays++;
  if(appData.consecutiveDays > appData.maxConsecutiveDays){
    appData.maxConsecutiveDays = appData.consecutiveDays;
  }

  // Check realm breakthrough
  const oldRealm = getRealmFromQi(appData.totalQi - totalQi);
  const newRealm = getRealmFromQi(appData.totalQi);
  const breakthrough = (oldRealm.idx < newRealm.idx) || (oldRealm.stage < newRealm.stage);

  // Save session
  const session = {
    date: today,
    exercises: currentTraining.map(function(item){
      var ex = appData.exercises[item.exerciseIdx];
      return {
        exerciseIdx: item.exerciseIdx,
        equipment: item.equipment || DEFAULT_EQUIPMENT[ex ? ex.name : ''] || 'barbell',
        sets: item.sets.map(function(s){ return {reps:s.reps, weight:s.weight}; })
      };
    }),
    totalQi: totalQi,
    rawQi: rawQi,
    conBonus: conBonus,
    penalty: hasPenalty,
    hasPR: hasPR,
  };
  appData.sessions.push(session);

  // Update muscle history
  if(!appData.muscleHistory) appData.muscleHistory = {};
  appData.muscleHistory[today] = newMuscles;
  appData.lastMuscleGroups = newMuscles;

  // Update exercise grades
  appData.exercises.forEach(e=>{
    updateExerciseGrade(e);
  });

  // Weekly history
  updateWeeklyHistory(today, totalQi);

  // Update NPC
  updateNPC();

  appData.totalTrainingDays++;
  appData.lastActiveDate = today;
  saveData();

  // Show summary
  showSummary({
    totalQi, rawQi, conBonus, hasPenalty, hasPR, prText, breakthrough,
    oldRealm, newRealm, todayQi: appData.todayQi
  });

  // Check weekly volume
  const weeklyCheck = checkWeeklyVolume();

  // Check achievements
  checkAchievements();

  // Check secret realm appearance
  checkSecretRealmAppearance();
  updateRealmBadge();

  // Clear current training
  currentTraining = [];
  updateHeader();
  renderRealm();
  renderQuotes();
  renderWarnings();
}

function updateExerciseGrade(ex){
  // Grade based on total volume
  const vol = ex.totalVolume;
  const grades = ['黄阶','玄阶','地阶','天阶','圣阶','神阶'];
  const thresholds = [0, 1000, 5000, 20000, 50000, 100000];
  for(let i=thresholds.length-1;i>=0;i--){
    if(vol >= thresholds[i]){ ex.grade = grades[i]; break; }
  }

  // Proficiency based on total sets
  const sets = ex.totalSets;
  const profs = ['初窥门径','小成','大成','圆满','化境'];
  const pThresholds = [0, 30, 100, 300, 1000];
  for(let i=pThresholds.length-1;i>=0;i--){
    if(sets >= pThresholds[i]){ ex.proficiency = profs[i]; break; }
  }
}

function updateWeeklyHistory(today, qi){
  const weekStart = getWeekStart(today);
  let found = false;
  if(!appData.weeklyQiHistory) appData.weeklyQiHistory = [];
  appData.weeklyQiHistory.forEach(w=>{
    if(w.week === weekStart){
      w.total += qi;
      found = true;
    }
  });
  if(!found){
    appData.weeklyQiHistory.push({week:weekStart, total:qi});
  }
}

function updateNPC(){
  appData.npcLeaderboard.forEach((npc,i)=>{
    const mult = NPC_QI_MULTIPLIERS[i % NPC_QI_MULTIPLIERS.length];
    // NPC grows based on user's progress
    const targetQi = Math.round(appData.totalQi * mult);
    // Gradual approach
    npc.qi = Math.round(npc.qi + (targetQi - npc.qi) * 0.1);
    const r = getRealmFromQi(npc.qi);
    npc.title = REALMS[r.idx].name + '·' + STAGES[r.stage];
  });
}

function renderSkillDetail(ex, exGlobalIdx){
  var info = EXERCISE_INFO[ex.name] || {desc:'暂无详细描述',tips:'',target:'',sci:''};

  var history = [];

      if(item.exerciseIdx === exGlobalIdx || (appData.exercises[item.exerciseIdx] && appData.exercises[item.exerciseIdx].name === ex.name)){
        item.sets.forEach(function(set){
          history.push({date:s.date, reps:set.reps, weight:set.weight});
        });
      }
    });
  });
  // Get latest 5 entries
  var recent = history.slice(-5).reverse();
  
  var dhtml = '<div style="border-top:1px solid rgba(201,169,110,.1);padding:12px 0 0;margin-top:10px">';
  // Info section
  dhtml += '<div style="font-size:13px;color:var(--text);line-height:1.6;margin-bottom:10px">';

  dhtml += '</div>';
  if(info.tips){
    dhtml += '<div style="font-size:12px;color:var(--warm);margin-bottom:6px">💡 '+info.tips+'</div>';
  }
  dhtml += '<div style="font-size:12px;color:var(--text2);margin-bottom:6px">🎯 目标肌群：'+info.target+'</div>';
  dhtml += '<div style="font-size:12px;color:var(--text2);margin-bottom:10px;font-style:italic">📚 '+info.sci+'</div>';
  // PR history
  if(ex.prCount > 0){
    dhtml += '<div style="font-size:12px;color:var(--gold-bright);margin-bottom:6px">🌟 共突破 '+ex.prCount+' 次个人纪录</div>';
  }
  // Recent training history
  if(recent.length > 0){
    dhtml += '<div style="font-size:12px;color:var(--text2);margin-bottom:4px">📋 最近训练记录</div>';
    recent.forEach(function(r){
      dhtml += '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03)">';

  dhtml += '</div>';

function getTodayPlan(){

  if(!routeId || routeId === 'none') return null;
  const plan = ROUTE_PLANS[routeId];

  const startDate = appData.sessions.length > 0 ? appData.sessions[0].date : getTodayStr();

function checkSecretRealmAppearance(){
  if(!appData.secretRealm) appData.secretRealm = { active:null, history:[], lastAppearance:null, weekCount:0, weekStart:null };
  var sr = appData.secretRealm;
  var today = getTodayStr();
  var consecutive = appData.consecutiveDays || 0;
  
  // Already active? Don't create another
  if(sr.active && sr.active.expiresAt && sr.active.expiresAt > today) return;
  
  // Reset weekly count
  var weekStart = getWeekStart(today);
  if(sr.weekStart !== weekStart){ sr.weekCount = 0; sr.weekStart = weekStart; }
  
  // Max 3 per week
  if(sr.weekCount >= 3) return;
  
  // Don't appear on 5+ consecutive days
  if(consecutive >= 5) return;
  
  // Conditions: consecutive 2-4, last training >= 1 day ago
  if(consecutive < 2 || consecutive > 4) return;
  
  // Check last appearance was at least 1 day ago
  var lastDate = sr.lastAppearance;
  if(lastDate && daysBetween(lastDate, today) < 1) return;
  
  // Base 40% chance
  var chance = 0.4;
  // Check if user recently broke PR (last 3 sessions)
  var recentSessions = appData.sessions.slice(-3);
  var recentPR = recentSessions.some(function(s){ return s.hasPR; });
  if(recentPR) chance += 0.2;
  
  if(Math.random() > chance) return;
  
  // Generate realm
  var realm = generateSecretRealm();
  if(!realm) return;
  sr.active = realm;
  sr.lastAppearance = today;
  sr.weekCount++;
  saveData();
  updateRealmBadge();
}

function generateSecretRealm(){
  var consecutive = appData.consecutiveDays || 0;
  var today = getTodayStr();
  var isRestDay = appData.lastActiveDate !== today;
  var types = [];
  
  // Decide type
  if(consecutive >= 4 || isRestDay){
    // Recovery realm
    var recList = [
      { title:'🧘 静修秘境·舒展经脉', desc:'天地间灵气温和，一处静修秘境在晨光中显现。踏入其中，经脉自然舒展。\n\n完成 15 分钟全身拉伸，感受灵力在体内缓缓流淌。', reward:30, action:'拉伸 15 分钟' },
      { title:'🚶 静修秘境·采气归元', desc:'山林间灵气浓郁，一处采气秘境入口散发明月般的光晕。\n\n散步 30 分钟，配合深呼吸，让天地灵气与体内灵力共鸣。', reward:40, action:'散步 30 分钟' },
      { title:'🛌 静修秘境·入定冥想', desc:'一处隐秘的石室出现在你面前，壁上刻满静心法诀。\n\n泡沫轴放松 10 分钟，或静坐调息，让身心回归宁静。', reward:25, action:'放松 10 分钟' },
    ];
    return { type:'recovery', sub: recList[Math.floor(Math.random()*recList.length)], completed:false, createdAt:today, expiresAt:getDateStr(new Date(Date.now()+86400000)) };
  }
  
  // Normal training realm (challenge)
  var exList = appData.exercises.filter(function(e){ return !e._deleted; });
  if(exList.length === 0) return null;
  
  // Try to pick a less-trained exercise (legacy realm)
  exList.sort(function(a,b){ return a.totalSets - b.totalSets; });
  var leastTrained = exList[0];
  
  // 30% chance: legacy realm (try new exercise)
  if(Math.random() < 0.3 && leastTrained.totalSets < 5){
    return generateLegacyRealm(leastTrained);
  }
  
  // Otherwise: trial realm
  return generateTrialRealm(exList);
}

function generateTrialRealm(exList){
  var today = getTodayStr();
  var yesterday = getYesterdayStr();
  var yMuscles = appData.muscleHistory && appData.muscleHistory[yesterday] ? appData.muscleHistory[yesterday] : [];
  
  // Same muscle protection
  var available = exList.filter(function(e){ return yMuscles.indexOf(e.muscle) === -1; });
  if(available.length === 0) available = exList;
  
  var ex = available[Math.floor(Math.random() * available.length)];
  
  // Past 14 days avg
  var avgVol = 0, count = 0;
  appData.sessions.forEach(function(s){
    var dd = daysBetween(s.date, today);
    if(dd <= 14 && dd >= 0){
      s.exercises.forEach(function(item){
        var e = appData.exercises[item.exerciseIdx];
        if(e && e.muscle === ex.muscle){
          item.sets.forEach(function(set){ avgVol += (set.weight||0)*(set.reps||0); count++; });
        }
      });
    }
  });
  if(count > 0) avgVol = Math.round(avgVol/count);
  else avgVol = Math.round((appData.user.weight||70)*10);
  
  var target = Math.round(avgVol * (1.0 + Math.random()*0.15));
  var reward = Math.round(target * 0.05 * ex.coeff) + 30;
  
  var desc = '灵力波动！一座试炼秘境在虚空中浮现。「'+ex.alias+'」的试炼——通道中灵力凝聚成'+ex.name+'的形状。\n\n完成总量达到 '+target+' 即可吸收秘境中的灵力。（基于你过去14天的修炼数据，难度恰到好处。）\n\n量力而行，机缘来去自如，不损道心。';
  
  return {
    type:'trial',
    title: '⚔️ 试炼秘境·'+ex.alias,
    desc: desc,
    reward: reward,
    exName: ex.name,
    exIdx: exList.indexOf(ex),
    target: target,
    muscle: ex.muscle,
    completed: false,
    createdAt: today,
    expiresAt: getDateStr(new Date(Date.now()+86400000)),
  };
}

        html += '<div style="font-size:12px;color:var(--text2);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03)">';
        html += '<span>'+h.date.slice(5)+' · '+h.title+'</span>';
        html += '<span style="float:right;color:var(--gold-bright)">+'+h.reward+'</span></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  container.innerHTML = html;
}

function completeSecretRealm(){
  var sr = appData.secretRealm;
  if(!sr || !sr.active || sr.active.completed) return;
  
  var r = sr.active;
  var reward = r.sub ? r.sub.reward : (r.reward || 30);
  
  // For trial realm, check if user actually trained
  if(r.type === 'trial' && r.exName){
    var today = getTodayStr();
    var trainedToday = appData.sessions.some(function(s){ return s.date === today; });
    if(!trainedToday){
      if(!confirm('你尚未完成今日修炼。踏入秘境前先完成推荐训练，灵力吸收效果更佳。\n\n直接领取灵力馈赠（减半）？')){
        showToast('🧘 秘境静候你的到来，修炼完后再来不迟');
        return;
      }
      reward = Math.round(reward * 0.5);
    }
  }
  
  // Mark completed
  r.completed = true;
  r.completedAt = getTodayStr();
  if(!sr.history) sr.history = [];
  sr.history.push({ date:getTodayStr(), title:r.title||r.sub?.title||'秘境', reward:reward });
  sr.active = null;
  
  // Award qi
  appData.totalQi += reward;
  appData.todayQi = (appData.todayQi || 0) + reward;
  saveData();
  
  renderSecretRealm();
  updateHeader();
  renderRealm();
  updateRealmBadge();
  showToast('🏛️ 秘境探索完成！灵力 +'+reward+'，天地法则在你身上又深了一层共鸣');
}

function updateRealmBadge(){
  var badge = document.getElementById('realm-badge');
  if(!badge) return;
  var sr = appData.secretRealm;
  var hasActive = sr && sr.active && !sr.active.completed;
  if(sr && sr.active && sr.active.expiresAt && sr.active.expiresAt < getTodayStr()){
    sr.active = null;
    saveData();
    hasActive = false;
  }
  badge.style.display = hasActive ? 'block' : 'none';
}

// Keep getYesterdayStr for backwards compat
function getYesterdayStr(){
  var d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}

// Toast system
function showToast(msg){
  var existing = document.getElementById('toast-container');
  if(!existing){
    const tc = document.createElement('div');
    tc.id = 'toast-container';
    tc.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;text-align:center;pointer-events:none';
    document.body.appendChild(tc);
    existing = tc;
  }
  const el = document.createElement('div');
  el.style.cssText = 'background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);padding:20px 24px;color:var(--text);font-size:14px;line-height:1.6;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.6);animation:breakthrough .4s ease;margin:8px';
  el.textContent = msg;
  existing.appendChild(el);
  setTimeout(function(){ el.style.opacity = '0'; el.style.transition = 'opacity .5s'; setTimeout(function(){ el.remove(); },500); }, 2500);
}

// ===================================================================
// ATLAS (图谱) & LEADERBOARD & ACHIEVEMENTS
// ===================================================================
const ACHIEVEMENTS = [
  { id:'first_pr', name:'凡骨逆袭', icon:'🦴', desc:'首次突破个人纪录' },
  { id:'qi_500', name:'焚炉重铸', icon:'🔥', desc:'单次修炼灵力超 500' },
  { id:'consecutive_30', name:'暗夜苦修', icon:'🌙', desc:'连续 30 天不间断修炼' },
  { id:'rest_50', name:'道心通明', icon:'🧘', desc:'累计休息日达 50 天' },
  { id:'trib_10', name:'雷劫洗礼', icon:'⚡', desc:'完成 10 次天劫' },
  { id:'realm_7', name:'此界巅峰', icon:'👑', desc:'达合体境' },
];

function renderAtlas(){
  const container = document.getElementById('atlas-content');
  if(!container) return;
  
  var html = '';
  
  // Stats overview
  const realmInfo = getRealmFromQi(appData.totalQi);
  const totalSessions = appData.sessions.length;
  const totalRest = appData.totalRestDays || 0;
  const ratio = totalRest > 0 ? (totalSessions / totalRest).toFixed(1) : totalSessions;
  
  html += '<div class="atlas-section">';
  html += '<h3>📊 修炼总览</h3>';
  html += '<div class="atlas-stat-row">';
  html += '<div class="atlas-stat"><div class="as-value">'+appData.totalQi+'</div><div class="as-label">总灵力</div></div>';
  html += '<div class="atlas-stat"><div class="as-value">'+totalSessions+'</div><div class="as-label">修炼次数</div></div>';
  html += '<div class="atlas-stat"><div class="as-value">'+totalRest+'</div><div class="as-label">休息日</div></div>';
  html += '<div class="atlas-stat"><div class="as-value">'+ratio+'</div><div class="as-label">修炼/休息比</div></div>';
  html += '</div>';
  if(ratio >= 3 && ratio <= 5){
    html += '<div style="text-align:center;font-size:12px;color:var(--success)">✅ 修炼休息比在健康范围（3:1 ~ 5:1）</div>';
  } else if(ratio > 5){
    html += '<div style="text-align:center;font-size:12px;color:var(--warm)">⚠️ 修炼偏多，建议适当增加休息日</div>';
  } else if(ratio < 3 && totalSessions > 0){
    html += '<div style="text-align:center;font-size:12px;color:var(--text2)">修炼强度偏低，道友可多精进</div>';
  }
  html += '</div>';
  
  // Timeline (realm breakthroughs)
  html += '<div class="atlas-section">';
  html += '<h3>🏔️ 境界突破时间线</h3>';
  html += '<div class="timeline">';
  // Show initial realm
  html += '<div class="timeline-item"><div class="ti-date">初始</div><div class="ti-text">'+REALMS[0].name+'·初期（根骨鉴定）</div></div>';
  // Check sessions for breakthrough-like entries
  var displayedRealms = {};
  appData.sessions.forEach(function(s){
    const r = getRealmFromQi(s.totalQi || 0);
    const key = r.idx+'-'+r.stage;
    if(!displayedRealms[key]){
      displayedRealms[key] = true;
      if(r.idx > 0 || r.stage > 0){
        html += '<div class="timeline-item"><div class="ti-date">'+s.date+'</div><div class="ti-text">'+REALMS[r.idx].name+'·'+STAGES[r.stage]+'</div></div>';
      }
    }
  });
  if(Object.keys(displayedRealms).length <= 1){
    html += '<div style="text-align:center;font-size:13px;color:var(--text2);padding:12px">修行之路刚刚开始，继续努力突破！</div>';
  }
  html += '</div></div>';
  
  // Weekly Chart (last 6 weeks)
  html += '<div class="atlas-section">';
  html += '<h3>📈 周修炼灵力</h3>';
  var maxWeekQi = 1;
  var weekData = [];
  const today = getTodayStr();
  for(var w=5; w>=0; w--){
    const ws = getWeekStart(today, w);
    var total = 0;
    if(appData.weeklyQiHistory){
      appData.weeklyQiHistory.forEach(function(wh){
        if(wh.week === ws) total += wh.total;
      });
    }
    weekData.push({week:ws, total:total});
    if(total > maxWeekQi) maxWeekQi = total;
  }
  if(maxWeekQi === 0) maxWeekQi = 1;
  weekData.forEach(function(wd){
    const pct = Math.max(2, Math.round(wd.total / maxWeekQi * 100));
    const label = wd.week.slice(5); // MM-DD
    var dangerMarker = '';
    // Check if that week had >5 consecutive days (simplified: check consecutive days tracked)
    html += '<div class="chart-bar-wrap"><div class="chart-label">'+label+'</div><div class="chart-bar-track"><div class="chart-bar-fill" style="width:'+pct+'%"></div></div><div class="chart-bar-value">'+wd.total+'</div></div>';
  });
  html += '</div>';
  
  // Muscle distribution
  html += '<div class="atlas-section">';
  html += '<h3>💪 肌群修炼分布</h3>';
  var muscleTotals = { '腿':0, '胸':0, '背':0, '核心':0, '臂':0, '肩':0, '臀':0, '背+腿':0 };
  var totalVolume = 0;
  appData.sessions.forEach(function(session){
    session.exercises.forEach(function(item){
      const e = appData.exercises[item.exerciseIdx];
      if(e){
        item.sets.forEach(function(set){
          const vol = (set.weight || 0) * (set.reps || 0);
          muscleTotals[e.muscle] = (muscleTotals[e.muscle] || 0) + vol;
          totalVolume += vol;
        });
      }
    });
  });
  // Merge 背+腿 into their components
  if(muscleTotals['背+腿']){
    muscleTotals['腿'] = (muscleTotals['腿'] || 0) + Math.round(muscleTotals['背+腿'] * 0.5);
    muscleTotals['背'] = (muscleTotals['背'] || 0) + Math.round(muscleTotals['背+腿'] * 0.5);
  }
  if(totalVolume === 0) totalVolume = 1;
  var muscleColors = {'腿':'#e74c3c','胸':'#3498db','背':'#2ecc71','核心':'#f39c12','臂':'#9b59b6','肩':'#1abc9c','臀':'#e67e22'};
  Object.keys(muscleColors).forEach(function(m){
    const vol = muscleTotals[m] || 0;
    const pct = Math.round(vol / totalVolume * 100);
    if(pct > 0){
      html += '<div class="muscle-bar"><div class="mb-label"><span>'+m+'</span><span>'+pct+'%</span></div><div class="mb-track"><div class="mb-fill" style="width:'+pct+'%;background:'+muscleColors[m]+';"></div></div></div>';
    }
  });
  if(totalVolume <= 1){
    html += '<div style="text-align:center;font-size:13px;color:var(--text2);padding:12px">暂无训练数据，开始修炼后可见分布</div>';
  }
  html += '</div>';
  
  // Achievements
  html += '<div class="atlas-section">';
  html += '<h3>🏆 称号成就</h3>';
  html += '<div class="achievement-grid">';
  ACHIEVEMENTS.forEach(function(ach){
    var unlocked = appData.achievements && appData.achievements.indexOf(ach.id) !== -1;
    html += '<div class="achievement-item '+(unlocked?'unlocked':'locked')+'">';
    html += '<div class="ai-icon">'+ach.icon+'</div>';
    html += '<div class="ai-name">'+(unlocked?'✅ ':'🔒 ')+ach.name+'</div>';
    html += '</div>';
  });
  html += '</div></div>';
  
  // Leaderboard
  html += '<div class="lb-card">';
  html += '<h3>🏆 战力天榜</h3>';
  // Combine NPC + user
  var allEntries = appData.npcLeaderboard.map(function(npc, i){
    return { idx:i, name:npc.name, qi:npc.qi, title:npc.title, npcTitle:npc.npcTitle, desc:npc.desc, quote:npc.quote, isUser:false };
  });
  allEntries.push({ name:'我（'+appData.user.talent+'）', qi:appData.totalQi, title:REALMS[realmInfo.idx].name+'·'+STAGES[realmInfo.stage], isUser:true });
  allEntries.sort(function(a,b){ return b.qi - a.qi; });
  
  allEntries.forEach(function(entry, i){
    var rankClass = '';
    if(i === 0) rankClass = 'gold';
    else if(i === 1) rankClass = 'silver';
    else if(i === 2) rankClass = 'bronze';
    if(entry.isUser) rankClass = 'self';
    
    var htmlClick = entry.isUser ? '' : ' onclick="showNPCDetail('+entry.idx+')" style="cursor:pointer"';
    
    html += '<div class="lb-entry"'+htmlClick+'>';
    html += '<div class="lb-rank '+rankClass+'">'+(i+1)+'</div>';
    html += '<div class="lb-name '+(entry.isUser?'self':'')+'">'+entry.name+'</div>';
    if(!entry.isUser) html += '<div class="lb-name" style="font-size:10px;color:var(--text2)">'+entry.npcTitle+'</div>';
    html += '<div class="lb-realm">'+entry.title+'</div>';
    html += '<div class="lb-qi">'+entry.qi+'</div>';
    html += '</div>';
  });
  html += '</div>';
  
  // Data export/import
  html += '<div class="atlas-section">';
  html += '<h3>📦 数据管理</h3>';
  html += '<div style="display:flex;gap:8px;margin-bottom:8px">';
  html += '<button onclick="exportData()" style="flex:1;padding:12px;border:none;border-radius:8px;background:rgba(201,169,110,.15);color:var(--gold);font-size:14px;cursor:pointer;min-height:44px">📤 导出数据</button>';
  html += '<button onclick="document.getElementById(\'import-input\').click()" style="flex:1;padding:12px;border:none;border-radius:8px;background:rgba(201,169,110,.15);color:var(--gold);font-size:14px;cursor:pointer;min-height:44px">📥 导入数据</button>';
  html += '</div>';
  html += '<input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">';
  html += '<div style="font-size:12px;color:var(--text2);text-align:center">数据仅保存在本地，导入将覆盖当前所有修炼数据</div>';
  html += '</div>';
  
  // Weight editor
  html += '<div class="atlas-section">';
  html += '<h3>⚖️ 肉身根基数据</h3>';
  html += '<div style="font-size:14px;color:var(--text)">当前体重：'+appData.user.weight+' kg</div>';
  html += '<div class="weight-edit"><input type="number" id="weight-input" value="'+appData.user.weight+'" min="20" max="400"><button onclick="updateWeight()">更新</button></div>';
  html += '<div style="font-size:13px;color:var(--text2);margin-top:8px">性别：'+(appData.user.gender==='male'?'♂ 男':appData.user.gender==='female'?'♀ 女':'不便透露')+'</div>';
  html += '<div style="font-size:13px;color:var(--text2)">天赋：'+appData.user.talent+'</div>';
  html += '</div>';
  
  container.innerHTML = html;
}

function showNPCDetail(npcIdx){
  var npc = appData.npcLeaderboard[npcIdx];
  if(!npc) return;
  var existing = document.getElementById('npc-detail-overlay');
  if(existing) existing.remove();
  var overlay = document.createElement('div');
  overlay.id = 'npc-detail-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)';
  var r = getRealmFromQi(npc.qi);
  var realmStr = REALMS[r.idx].name+'·'+STAGES[r.stage];
  var behind = appData.totalQi > npc.qi ? appData.totalQi - npc.qi : 0;
  var ahead = npc.qi > appData.totalQi ? npc.qi - appData.totalQi : 0;
  var html = '<div style="background:var(--card);border:1px solid var(--gold);border-radius:var(--radius);padding:20px;max-width:360px;width:100%;animation:breakthrough .3s ease">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">';
  html += '<div style="font-size:16px;font-weight:700;color:var(--gold2);font-family:\'Noto Serif SC\',\'Songti SC\',serif">'+(npc.npcTitle||'散修')+'</div>';
  html += '<button onclick="this.closest(\'#npc-detail-overlay\').remove()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer">✕</button>';
  html += '</div>';
  html += '<div style="text-align:center;margin-bottom:12px">';
  html += '<div style="font-size:20px;font-weight:700;color:var(--gold)">'+npc.name+'</div>';
  html += '<div style="font-size:14px;color:var(--gold2);margin-top:2px">'+realmStr+'</div>';
  html += '<div style="font-size:13px;color:var(--gold-bright);margin-top:4px">'+npc.qi+' 灵力</div>';
  html += '</div>';
  html += '<div style="font-size:13px;color:var(--text);line-height:1.6;margin-bottom:12px;padding:10px;background:rgba(0,0,0,.15);border-radius:8px">'+npc.desc+'</div>';
  if(npc.quote){
    html += '<div style="font-size:13px;color:var(--gold);font-style:italic;text-align:center;margin-bottom:12px;padding:8px;border-left:2px solid var(--gold)">'+npc.quote+'</div>';
  }
  // Comparison
  if(behind > 0){
    html += '<div style="font-size:12px;color:var(--success);text-align:center;padding:8px;background:rgba(92,184,92,.06);border-radius:8px">';
    html += '你已领先此道友 <span style="font-weight:700;font-size:14px">'+behind+'</span> 灵力</div>';
  } else if(ahead > 0){
    html += '<div style="font-size:12px;color:var(--warm);text-align:center;padding:8px;background:rgba(240,192,96,.06);border-radius:8px">';
    html += '距此道友还差 <span style="font-weight:700;font-size:14px">'+ahead+'</span> 灵力，继续努力！</div>';
  }
  html += '</div>';
  overlay.innerHTML = html;
  document.body.appendChild(overlay);
  overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
}

function updateWeight(){
  const val = parseFloat(document.getElementById('weight-input').value);
  if(val && val >= 20 && val <= 400){
    appData.user.weight = val;
    saveData();
    showToast('✅ 体重已更新为 '+val+' kg');
  } else {
    alert('请输入有效的体重（20-400 kg）');
  }
}

function exportData(){
  appData._exportDate = new Date().toISOString();
  const json = JSON.stringify(appData, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fanrenxunlianzhuan_data_'+getTodayStr()+'.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('📤 数据已导出！');
}

function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!data.user || !data.exercises){
        alert('无效的数据文件');
        return;
      }
      if(!confirm('导入将覆盖当前所有数据，确认继续？')) return;
      appData = data;
      saveData();
      // Refresh all
      updateHeader();
      renderRealm();
      renderQuotes();
      renderWarnings();
      renderAtlas();
      showToast('📥 数据已导入！');
    } catch(err){
      alert('数据解析失败：'+err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ===================================================================
// UPDATE INIT TO CHECK ACHIEVEMENTS
// ===================================================================
// Check and unlock achievements on endTraining
// (called from endTraining)
function checkAchievements(){
  if(!appData.achievements) appData.achievements = [];
  
  ACHIEVEMENTS.forEach(function(ach){
    if(appData.achievements.indexOf(ach.id) !== -1) return;
    
    var unlock = false;
    switch(ach.id){
      case 'first_pr':
        unlock = appData.exercises.some(function(e){ return e.prCount > 0; });
        break;
      case 'qi_500':
        unlock = appData.sessions.some(function(s){ return s.totalQi >= 500; });
        break;
      case 'consecutive_30':
        unlock = appData.maxConsecutiveDays >= 30;
        break;
      case 'rest_50':
        unlock = appData.totalRestDays >= 50;
        break;
      case 'trib_10':
        unlock = (appData.tribulations && appData.tribulations.small.length + appData.tribulations.large.length >= 10);
        break;
      case 'realm_7':
        unlock = getRealmFromQi(appData.totalQi).idx >= 7;
        break;
    }
    
    if(unlock){
      appData.achievements.push(ach.id);
      showToast('🏆 成就解锁：'+ach.icon+' '+ach.name+'！');
    }
  });
  
  saveData();
}
